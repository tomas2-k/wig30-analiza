name: WIG30 Daily Analysis

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 10:30 czasu polskiego (otwarcie)
    - cron: '00 11 * * 1-5'  # 13:00 czasu polskiego (południe)
    - cron: '30 15 * * 1-5'  # 17:30 czasu polskiego (po zamknięciu)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Create data folder
        run: mkdir -p data

      - name: Run analysis
        run: python deep_analysis.py

      - name: Inject data into HTML
        run: python inject_data.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,*.py,*.txt,*.md,data,index_template.html'
